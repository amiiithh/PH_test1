{% extends "base.html" %}
{% block title %}Payment Failed — PosterHub{% endblock %}
{% block content %}
<section class="success-box">
  <div class="success-icon fail-icon">&#10007;</div>
  <h2>Payment Failed</h2>
  <p>We couldn't confirm payment for order #{{ order.id }}. Your cart items are safe — you can try again.</p>
  <div style="display:flex; gap:14px; justify-content:center; margin-top:24px;">
    <a href="{% url 'orders:checkout' %}" class="btn btn-primary">Try Again</a>
    <a href="{% url 'store:cart_detail' %}" class="btn btn-outline">Back to Cart</a>
  </div>
</section>
{% endblock %}
