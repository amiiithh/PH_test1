{% extends "base.html" %}
{% block title %}All Collections — PosterHub{% endblock %}
{% block content %}
<section class="section container">
  <div class="section-head"><div><span class="eyebrow-label">Explore</span><h2>All Collections</h2></div></div>
  <div class="category-grid">
    {% for c in categories %}
      <a class="category-tile" href="{{ c.get_absolute_url }}">
        {% if c.image %}<img src="{{ c.image.url }}" alt="{{ c.name }}">{% endif %}
        <span class="label">{{ c.name }}</span>
      </a>
    {% empty %}
      <p>No collections yet.</p>
    {% endfor %}
  </div>
</section>
{% endblock %}
