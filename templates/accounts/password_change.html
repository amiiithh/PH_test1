{% extends "base.html" %}
{% block title %}Change Password — PosterHub{% endblock %}
{% block content %}
<div class="form-page">
  <div class="form-card">
    <h2 style="margin-bottom:20px;">Change Password</h2>
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
        <div class="field">
          <label for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {{ field.errors }}
        </div>
      {% endfor %}
      <button type="submit" class="btn btn-primary btn-block">Update Password</button>
    </form>
  </div>
</div>
{% endblock %}
